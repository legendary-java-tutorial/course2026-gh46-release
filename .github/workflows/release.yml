name: release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: сверка версии package.json с тегом (шаг курса)
        run: |
          v="v$(node -p 'require("./package.json").version')"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в package.json версия $v — поднимите версию своим PR и поставьте новый тег"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack
      - name: релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" translit-*.tgz --verify-tag --generate-notes
